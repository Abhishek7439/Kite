services:
  # 1. Backend Flask API
  - type: web
    name: kite-backend
    runtime: python
    region: singapore
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_SSL_CA
        sync: false
      - key: IMAGE_DIR
        value: /opt/render/project/src/Images
      - key: PYTHON_VERSION
        value: 3.11.6

  # 2. Frontend React Vite App (Static Site)
  - type: web
    name: kite-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_DB_IP
        sync: false
